<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبيل المجد | دليل المنصات التعليمية الرسمية</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b120c;
      --bg2: #121e14;
      --card: rgba(255, 255, 255, 0.04);
      --border: rgba(212, 175, 55, 0.2);
      --gold: #d4af37;
      --green: #6fbf73;
      --text: #f4f6f4;
      --text2: #9aa79c;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Amiri', serif;
      background: var(--bg);
      color: var(--text);
      padding: 15px;
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
    }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
    }
    .header h1 { font-size: 17px; color: var(--gold); }
    .back-btn {
      background: var(--card); border: 1px solid var(--border); color: var(--gold);
      padding: 6px 14px; border-radius: 10px; text-decoration: none; font-size: 12px; font-weight: bold;
      transition: 0.2s;
    }
    .back-btn:hover { background: rgba(212,175,55,0.1); }

    /* شريط اختيار المادة */
    .filter-box {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 14px;
      padding: 12px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px;
    }
    .filter-label { font-size: 12px; color: var(--gold); font-weight: bold; }
    .select-input {
      width: 100%; padding: 10px; border-radius: 10px; background: var(--bg);
      color: var(--text); border: 1px solid var(--border); font-family: 'Amiri', serif;
      font-size: 14px; outline: none; cursor: pointer;
    }

    /* كروت المدرسين والمنصات */
    .athr-card {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 14px;
      padding: 14px; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .btn-small {
      display: block; text-align: center; text-decoration: none;
      padding: 10px; background: var(--gold); color: #111; font-weight: bold;
      border-radius: 10px; font-size: 13px; margin-top: 8px; font-family: 'Amiri', serif;
      transition: 0.2s;
    }
    .btn-small:active { transform: scale(0.98); }

    /* لوحة الأدمن (مخفية افتراضياً) */
    #adminSection {
      display: none; background: rgba(212,175,55,0.05); border: 1px dashed var(--gold);
      border-radius: 14px; padding: 12px; margin-bottom: 16px;
    }
    .admin-input {
      width: 100%; padding: 8px; border-radius: 8px; background: var(--bg);
      color: var(--text); border: 1px solid var(--border); margin-bottom: 6px; font-size: 12px;
      font-family: 'Amiri', serif; outline: none;
    }
  </style>
</head>
<body>

  <!-- 1. الهيدر العلوي -->
  <div class="header">
    <h1>🌐 دليل المنصات التعليمية الرسمية</h1>
    <a href="index.html" class="back-btn">⬅️ العودة للرئيسية</a>
  </div>

  <!-- 2. لوحة الإضافة (تظهر للـ Admin عند إضافة ?admin=true للرابط) -->
  <div id="adminSection">
    <div style="font-size: 13px; font-weight: bold; color: var(--gold); margin-bottom: 8px;">⚙️ لوحة إضافة منصة ومدرس جديد:</div>
    <input type="text" id="teacherNameInp" placeholder="اسم المدرس..." class="admin-input">
    <input type="text" id="teacherBioInp" placeholder="تفاصيل ونبذة عن المنصة..." class="admin-input">
    <input type="text" id="teacherUrlInp" placeholder="رابط موقع المنصة على جوجل (مثال: https://...)" class="admin-input">
    <input type="text" id="teacherImgInp" placeholder="رابط صورة المدرس/المنصة..." class="admin-input">
    <button id="uploadTeacherBtn" class="btn-small" style="width: 100%; cursor: pointer;">➕ حفظ المنصة في قاعدة البيانات</button>
  </div>

  <!-- 3. شريط اختيار المادة -->
  <div class="filter-box">
    <label class="filter-label" for="subjSelect">📚 اختر المادة لعرض منصاتها المعتمدة على جوجل:</label>
    <select id="subjSelect" class="select-input">
      <option value="اللغة العربية">📖 اللغة العربية</option>
      <option value="الفيزياء">⚡ الفيزياء</option>
      <option value="الكيمياء">🧪 الكيمياء</option>
      <option value="الأحياء">🧬 الأحياء</option>
      <option value="اللغة الإنجليزية">🇬🇧 اللغة الإنجليزية</option>
      <option value="الرياضيات">📐 الرياضيات (كافة الفروع)</option>
    </select>
  </div>

  <!-- 4. وعاء عرض كروت المنصات -->
  <div id="teachersListContainer">
    <div style="text-align:center; padding:20px; color:var(--gold);">جاري تحميل دليل المنصات... ⏳</div>
  </div>

  <!-- 5. الجافاسكريبت والمزامنة -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD6lUURZNqgsHnjZaVz-T5Ww19TAjq6hjE",
      authDomain: "sabeel-almajd.firebaseapp.com",
      projectId: "sabeel-almajd",
      storageBucket: "sabeel-almajd.firebasestorage.app",
      messagingSenderId: "511150067201",
      appId: "1:511150067201:web:b249f496b9f5df5e6c7a00",
      measurementId: "G-205TS725KB"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let currentUser = null;

    // تفعيل لوحة الأدمن
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('admin') === 'true') {
      const adminSec = document.getElementById('adminSection');
      if (adminSec) adminSec.style.display = 'block';
    }

    // 🌐 داتا المنصات والمواقع الرسمية على جوجل
    const teachersDatabase = {
      "اللغة العربية": [
        {
          name: "أ/ محمد صلاح - منصة بسطتهالك",
          img: "https://bassthalk.com/assets/images/logo.png",
          bio: "منصة بسطتهالك الرسمية لشرح مناهج اللغة العربية واللغات، خرائط ذهنية وتدريبات تفاعلية.",
          platformUrl: "https://bassthalk.com",
          platformType: "منصة بسطتهالك الرسمية 🌐",
          rating: "⭐ 4.9"
        },
        {
          name: "أ/ رضا الفاروق - منصة الفاروق",
          img: "https://via.placeholder.com/150/121e14/d4af37?text=رضا+الفاروق",
          bio: "المنصة الرسمية للأستاذ رضا الفاروق لمتابعة المحاضرات الأسبوعية والواجبات والامتحانات الشاملة.",
          platformUrl: "https://redaelfarouk.com",
          platformType: "منصة الفاروق التعليمية 🌐",
          rating: "⭐ 5.0"
        }
      ],
      "الفيزياء": [
        {
          name: "م/ محمود مجدي - منصة الفيزياء",
          img: "https://via.placeholder.com/150/121e14/d4af37?text=محمود+مجدي",
          bio: "الموقع الرسمي للمهندس محمود مجدي لشرح مادة الفيزياء واختبارات الأونلاين ونظام المتابعة.",
          platformUrl: "https://mahmoudmagdy.com",
          platformType: "منصة المهندس محمود مجدي 🌐",
          rating: "⭐ 4.9"
        },
        {
          name: "أ/ محمد عبد المعبود - منصة عبد المعبود",
          img: "https://via.placeholder.com/150/121e14/d4af37?text=عبدالمعبود",
          bio: "الموقع التعليمي الرسمي لمتابعة شرح الكورس واختبارات حصص الفيزياء أونلاين.",
          platformUrl: "https://abdelmaboud.com",
          platformType: "منصة أستاذ الأجيال 🌐",
          rating: "⭐ 4.9"
        }
      ],
      "الكيمياء": [
        {
          name: "د/ محمد عبد الجواد - منصة الكيمياء",
          img: "https://via.placeholder.com/150/121e14/d4af37?text=عبدالجواد",
          bio: "المنصة التعليمية الخاصة بدكتور محمد عبد الجواد لحجز وشراء المحاضرات والحل الدائم.",
          platformUrl: "https://abdelgawad.com",
          platformType: "منصة د. محمد عبد الجواد 🌐",
          rating: "⭐ 5.0"
        },
        {
          name: "أ/ خالد صقر - منصة صقر التعليمية",
          img: "https://via.placeholder.com/150/121e14/d4af37?text=خالد+صقر",
          bio: "منصة الأستاذ خالد صقر المتخصصة في الكيمياء الشاملة للثانوية العامة.",
          platformUrl: "https://khaledsaker.com",
          platformType: "منصة صقر التعليمية 🌐",
          rating: "⭐ 4.8"
        }
      ],
      "الأحياء": [
        {
          name: "د/ أحمد الجوهري - منصة الجوهري",
          img: "https://via.placeholder.com/150/121e14/d4af37?text=الجوهري",
          bio: "منصة الدكتور أحمد الجوهري المتخصصة في الأحياء والبيولوجيا المكملة للنظام الحديث.",
          platformUrl: "https://eljohary.com",
          platformType: "منصة الجوهري الرسمية 🌐",
          rating: "⭐ 4.9"
        },
        {
          name: "منصة الخطة التعليمية (General)",
          img: "https://via.placeholder.com/150/121e14/d4af37?text=الخطة",
          bio: "منصة الخطة لشرح مواد الثانوية العامة والشعب العلمية والأدبية كورس كامل.",
          platformUrl: "https://elkheta.com",
          platformType: "منصة الخطة 🌐",
          rating: "⭐ 4.7"
        }
      ],
      "اللغة الإنجليزية": [
        {
          name: "مستر عمرو رجب - منصة الإنجليزي",
          img: "https://via.placeholder.com/150/121e14/d4af37?text=عمرو+رجب",
          bio: "الموقع الرسمي لمستر عمرو رجب لمتابعة محاضرات الجرامر واختبارات المهارات.",
          platformUrl: "https://amrrajab.com",
          platformType: "منصة مستر عمرو رجب 🌐",
          rating: "⭐ 4.8"
        }
      ]
    };

    document.addEventListener('DOMContentLoaded', () => {
      const subjSelect = document.getElementById('subjSelect');
      const addTeacherBtn = document.getElementById('uploadTeacherBtn');

      if (subjSelect) subjSelect.addEventListener('change', loadTeachersList);
      if (addTeacherBtn) addTeacherBtn.addEventListener('click', uploadTeacherToFirebase);

      onAuthStateChanged(auth, (user) => {
        currentUser = user;
      });

      loadTeachersList();
    });

    // دالة عرض كروت المنصات
    async function loadTeachersList() {
      const subjSelect = document.getElementById('subjSelect');
      const subj = subjSelect ? subjSelect.value : "اللغة العربية";
      const container = document.getElementById('teachersListContainer');

      if (!container) return;

      container.innerHTML = `<div style="text-align:center; padding:20px; color:var(--gold);">جاري تحميل منصات جوجل للمادة... ⏳</div>`;

      let teachersList = [...(teachersDatabase[subj] || [])];

      // جلب المدرسين والمنصات الإضافية من Firebase
      try {
        const q = query(collection(db, "teachers"), where("subject", "==", subj));
        const querySnapshot = await getDocs(q);
        querySnapshot.forEach((doc) => {
          teachersList.push(doc.data());
        });
      } catch (err) {
        console.log("Firebase status: ", err.message);
      }

      if (teachersList.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text2); font-size:13px;">لا توجد منصات مسجلة لهذه المادة حالياً.</div>`;
        return;
      }

      let html = '';
      teachersList.forEach((t) => {
        html += `
          <div class="athr-card">
            <div style="display:flex; align-items:center; gap:12px; margin-bottom:8px;">
              <img src="${t.img || 'https://via.placeholder.com/80'}" style="width:65px; height:65px; border-radius:50%; object-fit:cover; border:2px solid var(--gold);" onerror="this.src='https://via.placeholder.com/80/121e14/d4af37?text=منصة'">
              <div>
                <div style="font-size:16px; font-weight:bold; color:var(--gold);">${t.name}</div>
                <div style="font-size:11px; color:var(--green); font-weight:bold; margin-top:2px;">${t.platformType || 'موقع تعليمي'} • ${t.rating || '⭐ ممتاز'}</div>
              </div>
            </div>

            <p style="font-size:12px; color:var(--text); line-height:1.6; margin-bottom:6px;">${t.bio}</p>

            <a href="${t.platformUrl}" target="_blank" class="btn-small">
              🌐 الدخول للموقع الرسمي للمنصة
            </a>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // دالة إضافة منصة جديدة كـ Admin
    async function uploadTeacherToFirebase() {
      if (!currentUser) {
        alert("من فضلك سجل الدخول أولاً كـ أدمن 🙏");
        return;
      }

      const subj = document.getElementById('subjSelect').value;
      const name = document.getElementById('teacherNameInp').value.trim();
      const bio = document.getElementById('teacherBioInp').value.trim();
      const url = document.getElementById('teacherUrlInp').value.trim();
      const imgUrl = document.getElementById('teacherImgInp').value.trim();

      if (!subj || !name || !url) {
        alert("يرجى إدخال اسم المدرس/المنصة وموقع جوجل الرسمي!");
        return;
      }

      try {
        await addDoc(collection(db, "teachers"), {
          subject: subj,
          name: name,
          bio: bio || "منصة تعليمية معتمدة للثانوية العامة.",
          platformUrl: url,
          img: imgUrl || "https://via.placeholder.com/80",
          addedBy: currentUser.email,
          createdAt: new Date().toISOString()
        });

        alert("🎉 تم حفظ موقع المنصة الرسمي بنجاح!");
        document.getElementById('teacherNameInp').value = '';
        document.getElementById('teacherBioInp').value = '';
        document.getElementById('teacherUrlInp').value = '';
        document.getElementById('teacherImgInp').value = '';
        loadTeachersList();
      } catch (err) {
        alert("خطأ أثناء الحفظ: " + err.message);
      }
    }
  </script>
</body>
</html>
