<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>سبيل المجد | بنك الدروس والمحاضرات</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b120c">

  <!-- ربط ملف الـ CSS الخارجي -->
  <link rel="stylesheet" href="style.css">

  <!-- 🌟 مكتبة Firebase V9 -->
  <script type="module" src="app.js"></script>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div style="display:flex; align-items:center; gap:8px;">
      <a href="../index.html" style="text-decoration:none; color:var(--gold); font-size:18px;">🏠</a>
      <h1>🎬 المحاضرات والدروس</h1>
    </div>

    <!-- تسجيل الدخول بجوجل -->
    <button class="auth-btn" id="googleLoginBtn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="14" alt="google">
      دخول بجوجل
    </button>

    <div class="user-badge" id="userProfileInfo" style="display: none;">
      <img src="" id="userImgDisplay" class="user-avatar" alt="user">
      <span id="userNameDisplay"></span>
      <button id="logoutBtn" style="background:transparent; border:none; color:#ff6b6b; cursor:pointer; font-size:12px;">🚪</button>
    </div>
  </div>

  <div class="app-container">

    <!-- 1️⃣ تصفية واختيار المادة والمدرس -->
    <div class="athr-card">
      <div style="font-size: 14px; font-weight: bold; color: var(--gold); margin-bottom: 10px; border-right: 3px solid var(--gold); padding-right: 8px;">
        🔍 اختيار المادة والمدرس المفضّل:
      </div>

      <label style="font-size: 11px; color: var(--text2);">المادة الدراسية:</label>
      <select id="subjSelect" class="custom-select">
        <option value="">-- اختر المادة --</option>
        <option value="اللغة العربية">📖 اللغة العربية</option>
        <option value="اللغة الإنجليزية">🇬🇧 اللغة الإنجليزية</option>
        <option value="الفيزياء">⚡ الفيزياء</option>
        <option value="الكيمياء">🧪 الكيمياء</option>
        <option value="الأحياء">🧬 الأحياء</option>
        <option value="الرياضيات">📐 الرياضيات (تفاضل/جبر/ديناميكا)</option>
      </select>

      <label style="font-size: 11px; color: var(--text2);">أشهر المدرسين المتاحين:</label>
      <select id="teacherSelect" class="custom-select">
        <option value="">-- اختر المادة أولاً --</option>
      </select>

      <button class="btn-gold" id="fetchLessonsBtn">🚀 عرض الدروس والمحاضرات</button>
    </div>
<div class="card admin-only" id="adminSection" style="display: none;">
    <h3>إضافة محاضرة جديدة (تزامن مع Firebase):</h3>
    <!-- باقي مدخلات النموذج -->
</div>
    <!-- 2️⃣ نموذج إضافة درس جديد -->
    <div class="athr-card" id="addLessonCard">
      <div style="font-size: 13px; font-weight: bold; color: var(--green); margin-bottom: 8px;">➕ إضافة محاضرة جديدة (تزامن مع Firebase):</div>
      
      <input type="text" id="lessonTitleInp" placeholder="عنوان الدرس (مثلاً: شرح قانون كيرشوف الأول)" class="custom-select" style="margin-bottom:6px;">
      <input type="text" id="youtubeUrlInp" placeholder="رابط فيديو يوتيوب (URL)" class="custom-select" style="margin-bottom:6px;">
      <input type="text" id="questionsUrlInp" placeholder="رابط ملزمة الأسئلة (PDF / Google Drive)" class="custom-select" style="margin-bottom:6px;">
      <input type="text" id="examUrlInp" placeholder="رابط امتحان الدرس (Google Forms / لينك)" class="custom-select" style="margin-bottom:8px;">

      <button id="uploadLessonBtn" style="width: 100%; background: var(--green); color: #111; border: none; padding: 8px; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: 'Amiri', serif;">
        💾 حفظ ونشر المحاضرة
      </button>
    </div>

    <!-- 3️⃣ قائمة عرض المحاضرات والدروس -->
    <div id="lessonsListContainer">
      <div style="text-align:center; padding:20px; color:var(--text2); font-size:12px;">
        اختر المادة والمدرس لمشاهدة جميع المحاضرات وملحقاتها 🌿
      </div>
    </div>

  </div>

</body>
</html>
